name: Precompiled NIFs

# Builds the NIF for every target in DicomCodecs.Native and attaches the
# archives to the GitHub release of the pushed tag. See README, "Releasing".

on:
  push:
    tags: ["v*"]
  # Rebuilds the binaries of an existing tag, e.g. after fixing this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Extract project version
        shell: bash
        run: echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> "$GITHUB_ENV"

      - name: Check that the tag matches mix.exs
        shell: bash
        run: test "${TAG}" = "v${PROJECT_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      # Same steps and file names as philss/rustler-precompiled-action, whose
      # v1.1.5 installs cross even with use-cross false and then fails on
      # macOS and Linux arm64 runners.
      - name: Build the NIF
        shell: bash
        working-directory: native/dicom_codecs_nif
        run: cargo build --release --target "${{ matrix.job.target }}"

      - name: Package the NIF
        id: package
        shell: bash
        run: |
          case "${{ matrix.job.target }}" in
            *-apple-*) built=libdicom_codecs_nif.dylib ;;
            *) built=libdicom_codecs_nif.so ;;
          esac
          # RustlerPrecompiled expects a .so name on every Unix, macOS included.
          name="libdicom_codecs_nif-v${PROJECT_VERSION}-nif-${{ matrix.nif }}-${{ matrix.job.target }}.so"
          cp "native/dicom_codecs_nif/target/${{ matrix.job.target }}/release/${built}" "${name}"
          tar -czf "${name}.tar.gz" "${name}"
          echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.file }}
          path: ${{ steps.package.outputs.file }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ steps.package.outputs.file }}
            THIRD_PARTY_NOTICES.md
