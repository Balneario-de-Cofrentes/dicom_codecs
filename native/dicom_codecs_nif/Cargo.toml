[package]
name = "dicom_codecs_nif"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "dicom_codecs_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"

# JPEG: decode (baseline, extended 8-bit, lossless) and baseline encode
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"

# JPEG 2000: OpenJPEG ported to Rust, no C toolchain needed
openjp2 = { version = "0.6.1", default-features = false, features = ["std"] }

# JPEG-LS: CharLS (C++), built with CMake and linked statically
charls-sys = { version = "2.4", features = ["static"] }

[profile.release]
lto = true
codegen-units = 1
